<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - C.P. Company</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="fonts/akony.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle-login" id="themeToggleLogin" aria-label="Toggle theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="login-container">
        <!-- Left side - Image -->
        <div class="login-image">
            <img id="loginPageImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="C.P. Company Model">
        </div>

        <!-- Right side - Form -->
        <div class="login-form-container">
            <div class="login-form-wrapper">
                <!-- Close button -->
                <button class="login-close-btn" id="registerCloseBtn" aria-label="Закрыть">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                
                <h1 class="login-title">СОЗДАТЬ<br>ЛИЧНЫЙ КАБИНЕТ</h1>

                <form class="login-form" id="registerForm">
                    <div class="form-group">
                        <label for="firstName" class="form-label">ИМЯ ПОЛЬЗОВАТЕЛЯ <span class="required">*</span></label>
                        <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Введите имя пользователя" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">АДРЕС ЭЛЕКТРОННОЙ ПОЧТЫ <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">ПАРОЛЬ <span class="required">*</span></label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required minlength="6">
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">ПОДТВЕРДИТЕ ПАРОЛЬ <span class="required">*</span></label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm password" required>
                            <button type="button" class="password-toggle" id="confirmPasswordToggle">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="newsletter" name="newsletter" checked>
                            <span class="checkmark"></span>
                            Я хочу получать информацию о новинках, скидках и специальных предложениях
                        </label>
                    </div>


                    <button type="submit" class="login-btn">СОЗДАТЬ УЧЕТНУЮ ЗАПИСЬ</button>
                </form>

                <div class="divider">
                    <hr>
                </div>

                <div class="new-customer-section">
                    <p class="new-customer-text">
                        Уже есть аккаунт? <a href="login.html" class="login-link">Войти</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
    <script>
        // Load login image from server
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/login-image');
                const data = await response.json();
                if (data.loginImage) {
                    document.getElementById('loginPageImage').src = data.loginImage;
                }
            } catch (error) {
                console.error('Error loading login image:', error);
                // Keep default image if error
            }
        });
    </script>
</body>
</html>
