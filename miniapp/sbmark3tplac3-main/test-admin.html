<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Features</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .test-button {
            padding: 10px 20px;
            margin: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .test-image {
            max-width: 300px;
            margin: 20px;
            display: inline-block;
        }
        
        .test-image img {
            width: 100%;
            height: auto;
            border: 2px solid #ddd;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            background: #f0f0f0;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Admin Features</h1>
    
    <div class="section">
        <h2>Admin Status</h2>
        <div id="admin-status" class="status">Checking...</div>
        <button onclick="checkAdminStatus()" class="test-button">Check Admin Status</button>
        <button onclick="loginAsAdmin()" class="test-button">Login as Admin</button>
    </div>
    
    <div class="section">
        <h2>Test Buttons with data-text-id</h2>
        <button data-text-id="test-btn-1" class="test-button">Test Button 1</button>
        <button data-text-id="test-btn-2" class="test-button">Test Button 2</button>
        <button data-text-id="test-btn-3" class="test-button">Test Button 3</button>
    </div>
    
    <div class="section">
        <h2>Test Images</h2>
        <div class="test-image">
            <img src="https://images.unsplash.com/photo-1578662996442-48f60103fc27?w=400" alt="Test Image 1">
        </div>
        <div class="test-image">
            <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400" alt="Test Image 2">
        </div>
        <div class="test-image">
            <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400" alt="Test Image 3">
        </div>
    </div>
    
    <div class="section">
        <h2>Console Output</h2>
        <div id="console-output" class="status" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
            Console messages will appear here...
        </div>
    </div>
    
    <!-- Load admin scripts -->
    <script src="security-check.js"></script>
    <script src="admin-loader.js"></script>
    
    <script>
        // Capture console logs
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
            consoleOutput.innerHTML += `<div style="color: #333;">[LOG] ${message}</div>`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
            consoleOutput.innerHTML += `<div style="color: red;">[ERROR] ${message}</div>`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        // Check admin status
        async function checkAdminStatus() {
            const statusDiv = document.getElementById('admin-status');
            const token = localStorage.getItem('adminToken');
            
            if (!token) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Not logged in as admin (no token)';
                console.log('No admin token found');
                return;
            }
            
            try {
                const response = await fetch('/api/check-admin', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.isAdmin) {
                        statusDiv.className = 'status success';
                        statusDiv.textContent = '✅ Logged in as admin';
                        console.log('Admin status verified');
                    } else {
                        statusDiv.className = 'status error';
                        statusDiv.textContent = 'Not an admin';
                        console.log('Not an admin');
                    }
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = 'Invalid token';
                    console.log('Invalid admin token');
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Error checking admin status: ' + error.message;
                console.error('Error checking admin status:', error);
            }
        }
        
        // Login as admin
        async function loginAsAdmin() {
            const username = prompt('Enter admin username:');
            const password = prompt('Enter admin password:');
            
            if (!username || !password) {
                console.log('Login cancelled');
                return;
            }
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminLoggedIn', 'true');
                    window.isAdminUser = true;
                    
                    console.log('Login successful, token saved');
                    checkAdminStatus();
                    
                    // Reload page to trigger admin scripts
                    setTimeout(() => {
                        location.reload();
                    }, 1000);
                } else {
                    console.error('Login failed');
                    alert('Login failed. Check credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login error: ' + error.message);
            }
        }
        
        // Check status on load
        window.addEventListener('load', () => {
            checkAdminStatus();
            
            // Log when enhanced editor initializes
            setTimeout(() => {
                if (window.enhancedEditor) {
                    console.log('Enhanced editor is available');
                } else {
                    console.log('Enhanced editor not loaded');
                }
                
                if (window.adminButtonEditor) {
                    console.log('Admin button editor is available');
                } else {
                    console.log('Admin button editor not loaded');
                }
            }, 2000);
        });
    </script>
</body>
</html>
