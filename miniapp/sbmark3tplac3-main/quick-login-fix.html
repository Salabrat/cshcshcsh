<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый вход - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
        }
        
        .debug-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Быстрый вход</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин:</label>
                <input type="text" id="username" value="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" value="admin123" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <div id="message" class="message"></div>
        <div id="debugInfo" class="debug-info" style="display: none;">
            <h3>Отладочная информация:</h3>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        const debugInfo = document.getElementById('debugInfo');
        const debugContent = document.getElementById('debugContent');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
        }

        function showDebug(data) {
            debugContent.innerHTML = '';
            for (const [key, value] of Object.entries(data)) {
                debugContent.innerHTML += `<strong>${key}:</strong> ${JSON.stringify(value)}<br>`;
            }
            debugInfo.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            showMessage('Выполняется вход...', 'success');
            
            try {
                // Clear old data
                localStorage.removeItem('adminToken');
                localStorage.removeItem('userLoggedIn');
                localStorage.removeItem('username');

                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                showDebug({
                    status: response.status,
                    ok: response.ok,
                    success: data.success,
                    token: data.token ? data.token.substring(0, 20) + '...' : 'null',
                    message: data.message
                });

                if (data.success && data.token) {
                    // Save token
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('username', 'admin');
                    
                    showMessage('✅ Вход выполнен успешно! Перенаправление...', 'success');
                    
                    // Verify token was saved
                    const savedToken = localStorage.getItem('adminToken');
                    console.log('Token saved:', !!savedToken);
                    console.log('Token value:', savedToken ? savedToken.substring(0, 20) + '...' : 'null');
                    
                    setTimeout(() => {
                        window.location.href = 'admin-panel.html';
                    }, 1500);
                } else {
                    showMessage('❌ Ошибка входа: ' + (data.message || 'Неверные данные'), 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ Ошибка при входе: ' + error.message, 'error');
                showDebug({ error: error.toString() });
            }
        });
    </script>
</body>
</html>
