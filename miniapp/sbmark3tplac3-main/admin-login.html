<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель - C.P. Company</title>
    <link rel="stylesheet" href="fonts/akony.css">
</head>
<body class="admin-body">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <!-- Logo -->
            <div class="admin-logo">
                <svg width="80" height="60" viewBox="0 0 80 60" fill="none">
                    <text x="0" y="30" font-family="Akony" font-size="18" font-weight="bold" fill="currentColor">C.P.</text>
                    <text x="0" y="45" font-family="Akony" font-size="12" font-weight="normal" fill="currentColor">COMPANY</text>
                </svg>
            </div>
            
            <h1 class="admin-title">Админ-панель</h1>
            <p class="admin-subtitle">Войдите в систему управления</p>
            
            <form class="admin-login-form" id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@admin.ru">
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="admin">
                </div>
                
                <button type="submit" class="admin-login-btn">
                    <span class="btn-text">ВОЙТИ</span>
                    <span class="btn-loading" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 11-6.219-8.56"/>
                        </svg>
                    </span>
                </button>
                
                <div class="error-message" id="errorMessage" style="display: none;">
                    Неверный email или пароль
                </div>
            </form>
            
            <div class="admin-footer">
                <a href="index.html" class="back-to-site">← Вернуться на сайт</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnText = document.querySelector('.btn-text');
            const btnLoading = document.querySelector('.btn-loading');
            const errorMessage = document.getElementById('errorMessage');
            
            // Show loading
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            errorMessage.style.display = 'none';
            
            // Simulate API call
            setTimeout(() => {
                if (email === 'admin@admin.ru' && password === 'admin') {
                    // Success - set admin login status and redirect to categories
                    localStorage.setItem('adminLoggedIn', 'true');
                    alert('Добро пожаловать в админ-панель! Режим администратора активирован.');
                    window.location.href = 'category-jackets.html';
                } else {
                    // Error
                    btnText.style.display = 'inline-block';
                    btnLoading.style.display = 'none';
                    errorMessage.style.display = 'block';
                }
            }, 1000);
        });
        
        // Check if already logged in
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'category-jackets.html';
        }
    </script>
    <script src="theme-toggle.js"></script>
</body>
</html>
